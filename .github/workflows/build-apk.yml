name: Build Music Chinese S61B APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'TidalCN_S61B_OneUpload.zip'
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack single ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f TidalCN_S61B_OneUpload.zip ]; then
            mkdir -p /tmp/s61b
            unzip -oq TidalCN_S61B_OneUpload.zip -d /tmp/s61b
            cp -a /tmp/s61b/. ./
          fi
          test -f app/build.gradle
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -d "$SDK/platforms/android-35" ]; then
            SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -Vr | head -n 1)"
            test -n "$SM"
            yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
            "$SM" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MusicChineseS61B-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
